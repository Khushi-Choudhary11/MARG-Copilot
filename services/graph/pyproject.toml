[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "marg-graph"
version = "1.0.0"
description = "MARG Railway Graph Engine — NetworkX-based corridor modelling for NDLS–CNB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MARG Team" },
]

dependencies = [
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",      # parallel test runs
  "ruff>=0.4",               # linting
  "mypy>=1.10",              # type checking
]

[tool.setuptools.packages.find]
where = [".."]
include = ["graph*"]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = ["-v", "--tb=short", "--strict-markers"]
filterwarnings = ["ignore::DeprecationWarning"]

# ── coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source   = ["services/graph"]
omit     = ["*/tests/*", "*/migrations/*"]
branch   = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 80

# ── ruff (linting) ───────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length    = 100
select         = ["E", "F", "W", "I", "N", "UP"]
ignore         = ["E501"]  # line length handled by formatter

[tool.ruff.isort]
known-first-party = ["services"]

# ── mypy (type checking) ─────────────────────────────────────────────────────

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
